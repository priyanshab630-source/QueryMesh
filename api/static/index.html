<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QueryMesh · multi-agent arXiv assistant</title>
  <style>
    :root {
      --bg: #0a0f16; --panel: #111a24; --line: #1f2c3a; --text: #e8eef5;
      --muted: #8fa3b8; --accent: #3ddc97; --accent-2: #4ea8ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55; }
    header { padding: 26px 32px 14px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    h1 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
    #status { font-size: 12px; color: var(--muted); text-align: right; }
    main { max-width: 900px; margin: 0 auto; padding: 26px 24px 70px; }
    .asker { display: flex; gap: 10px; }
    input { flex: 1; padding: 13px 15px; border-radius: 10px; font-size: 14.5px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text); }
    button { padding: 13px 20px; border: 0; border-radius: 10px; font-weight: 600;
      font-size: 14px; background: var(--accent); color: #05130d; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: progress; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { font-size: 12px; padding: 6px 11px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); cursor: pointer;
      background: transparent; }
    .chip:hover { border-color: var(--accent-2); color: var(--text); }
    .card { margin-top: 24px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px; }
    .answer { font-size: 15px; white-space: pre-wrap; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--muted); margin: 22px 0 8px; }
    .src { font-size: 13px; margin-bottom: 8px; }
    .src a { color: var(--accent-2); text-decoration: none; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 14px; }
    .trace { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, monospace; }
    .trace div { margin-bottom: 4px; }
    .agent { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>QueryMesh</h1>
      <p>Five agents over an arXiv corpus: hybrid retrieval, graded evidence, cited answers.</p>
    </div>
    <div id="status">loading…</div>
  </header>

  <main>
    <form class="asker" id="form">
      <input id="question" value="How does Self-RAG decide when retrieval is needed?" />
      <button id="go" type="submit">Ask</button>
    </form>
    <div class="chips" id="chips"></div>
    <section id="result"></section>
  </main>

<script>
const examples = [
  "How does Self-RAG decide when retrieval is needed?",
  "What did the graph RAG paper find about global questions?",
  "What is the cost of the graph RAG indexing stage?",
  "What is reciprocal rank fusion used for in hybrid search?"
];
const chips = document.getElementById("chips");
const questionInput = document.getElementById("question");
const result = document.getElementById("result");
const go = document.getElementById("go");

examples.forEach((text) => {
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.type = "button";
  chip.textContent = text;
  chip.onclick = () => { questionInput.value = text; run(); };
  chips.appendChild(chip);
});

fetch("/health").then((r) => r.json()).then((data) => {
  document.getElementById("status").innerHTML =
    `${data.papers} papers · ${data.chunks} chunks<br>llm: ${data.llm} · embeddings: ${data.embeddings} · cache: ${data.cache}`;
}).catch(() => { document.getElementById("status").textContent = "offline"; });

async function run() {
  go.disabled = true;
  result.innerHTML = "<div class='card'>Running the agent graph…</div>";
  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: questionInput.value, use_cache: true }),
    });
    const data = await response.json();

    const sources = data.citations.length
      ? data.citations.map((c) => `<div class="src">[${c.number}] ${c.title} —
          <a href="${c.url}" target="_blank" rel="noopener">arXiv ${c.paper_id}</a>
          <span style="color:var(--muted)">(${c.published})</span></div>`).join("")
      : "<div class='src' style='color:var(--muted)'>No verified citations.</div>";

    const trace = data.trace.map((t) =>
      `<div><span class="agent">${t.agent}</span> · ${t.message}</div>`).join("");

    result.innerHTML = `
      <div class="card">
        <div class="answer">${data.answer.replace(/</g, "&lt;")}</div>
        <h2>Sources</h2>${sources}
        <div class="meta">writer: ${data.meta.writer} · grounding:
          ${(data.meta.grounding ?? 0).toFixed(2)} · cache: ${data.meta.cache}
          · ${data.meta.elapsed_ms} ms</div>
        <h2>Agent trace</h2><div class="trace">${trace}</div>
      </div>`;
  } catch (error) {
    result.innerHTML = `<div class="card">${error.message}</div>`;
  } finally {
    go.disabled = false;
  }
}

document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault();
  run();
});
</script>
</body>
</html>
