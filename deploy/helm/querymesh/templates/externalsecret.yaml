{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator + a SecretStore named
# `aws-secrets-manager` backed by AWS Secrets Manager (IRSA for credentials).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "querymesh.fullname" . }}
  labels:
    {{- include "querymesh.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteSecretName }}
{{- end }}
