name: CD

# Builds the container image on every push to main and, when a cluster is
# configured, rolls it out with Helm. Deployment is disabled by default: set the
# repository variable ENABLE_DEPLOY=true and provide AWS_ROLE_ARN + CLUSTER_NAME
# to turn it on. Without that this workflow only builds and pushes the image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/querymesh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install querymesh deploy/helm/querymesh \
            --namespace querymesh --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set ingress.host=${{ vars.INGRESS_HOST }} \
            --wait --timeout 5m
